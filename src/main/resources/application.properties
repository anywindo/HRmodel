spring.application.name=hr-application

# MariaDB Connection settings
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hr_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Spring Boot Admin Client settings (points to itself since it's also a server)
spring.boot.admin.client.url=http://localhost:8080

# Management endpoints needed by Spring Boot Admin
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# CORS Configuration
cors.allowed.origins=${FRONTEND_URL:http://localhost:5173}

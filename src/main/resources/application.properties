spring.application.name=hr-application

# MariaDB Connection settings
spring.datasource.url=jdbc:mariadb://localhost:3306/hr_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Spring Boot Admin Client settings (points to itself since it's also a server)
spring.boot.admin.client.url=http://localhost:8080

# Management endpoints needed by Spring Boot Admin
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
